name: dcb.admin
ext:
  collector:
    run:
      -
        dir: 'dcb-hub-admin-ui'
        command: "npm ci"
        shell: true
      -
        dir: 'dcb-hub-admin-ui'
        command: "npx typedoc --entryPointStrategy Expand src --out ./typedocs"
        shell: true

    scan:
       
       # Scan directory relative to the repository root
       - dir: dcb-hub-admin-ui/typedocs
         clean: true

         # Into is anotra bucket not a physical directory
         into:
           dir: modules/api/attachments/typedoc
