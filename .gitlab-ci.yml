variables:
  FF_USE_FASTZIP: "true"
  # These can be specified per job or per pipeline
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  # Git hooks off in CI - husky's own switch, honoured at install and in the runner.
  # The release job commits (@semantic-release/git), which fired lint-staged, which
  # needs git >= 2.32.0 against the 2.30.2 in node:22-bullseye. Do NOT "fix" this by
  # bumping the image: lint-staged would then reformat the changelog semantic-release
  # had just generated. The checks themselves run as verify_* jobs.
  # See docs/testing.md, "Hooks are not the CI gates".
  HUSKY: "0"

  # See the `cache:` block below: without this npm writes to $HOME/.npm and the cache
  # entry covers a directory npm never touches.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  image:
    name: node:22.23.1-bullseye
    pull_policy: if-not-present

  tags:
    - ki-onprem

stages:
  - verify
  - build
  - release
  - rebuild
  - container
  - deploy

# Keyed on the LOCKFILE, not the branch. A per-branch key cannot be hit by the first
# pipeline on a new branch, which is most of them; a lockfile key is shared by every
# branch whose dependencies match, which is nearly all of them.
#
# `node_modules/` is NOT cached. Every job here runs `npm ci`, and `npm ci` deletes
# node_modules before installing - so caching it uploaded and downloaded a directory
# that was then thrown away, once per job, six times per pipeline.
#
# `.npm` IS the cache that helps, and it was not being used either: npm writes to
# $HOME/.npm, so a cache entry at $CI_PROJECT_DIR/.npm was saved empty and restored
# empty. npm_config_cache points npm at the path the cache actually covers.
cache:
  key:
    files:
      - dcb-hub-admin-ui/package-lock.json
  paths:
    - .npm

# On main this artefact is the deployment. On the release branch it is only a gate:
# it is built before semantic-release bumps the version, so build_released_bundle
# supersedes it there.
build:
  stage: build
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - git config --global user.name "ianibbo"
    - git config --global user.email "ian.ibbotson@k-int.com"
    - cd dcb-hub-admin-ui
    # vite.config.mts readFileSync's this with no fallback, so it must exist and
    # must sit next to package.json - i.e. be written AFTER the cd.
    - echo " { \"releaseDate\":\"`date +"%Y-%m-%dT%H:%M:%S%z"`\", \"RELEASED_AT\":\"$RELEASED_AT\" } " > ./release-info.json
    - npm ci
    # This remains the standalone asset/router base. The same artifact's
    # ki-bootstrap.js entry routes at "/" and resolves chunks from its own URL.
    - VITE_PUBLIC_URL=/dcb-admin/ npm run build
  artifacts:
    # Artifact paths are relative to the repo root, not to the job's cwd.
    paths:
      - dcb-hub-admin-ui/dist/
    expire_in: 1 hour

# W-3. Until this job existed the verify stage ran `e2e:ki-bootstrap` and nothing else:
# no lint, no type-check, no unit tests, no Playwright suite. Every quality rule the repo
# carries was therefore enforced by whoever remembered to run it locally, which is another
# way of saying it was not enforced. A rule that is not gated is not a rule.
#
# --max-warnings=0 because ESLint exits 0 on warnings otherwise, and a warning nobody is
# forced to read is a defect with a longer half-life.
#
# `npx vitest run`, never `npm run test` - that script is bare `vitest`, i.e. watch mode,
# which in CI is a job that never finishes.
verify_quality:
  stage: verify
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    - npm run lint -- --max-warnings=0
    - npx tsc --noEmit
    # --coverage rather than a bare run: it costs about three seconds on top of the
    # suite and puts the figure in every pipeline log. There is NO threshold - see
    # docs/testing.md, "Coverage is a figure, not a gate". Nothing here fails on it.
    - npx vitest run --coverage --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml
  interruptible: true
  timeout: 20m
  artifacts:
    when: always
    paths:
      - dcb-hub-admin-ui/coverage/
      - dcb-hub-admin-ui/test-results/
    # junit, so 1,542 unit tests arrive as a Tests tab and a merge request widget
    # rather than as the last page of a job log. Before this the pipeline had NO
    # machine-readable result of any kind: a failure count had to be read by eye, and
    # "which test" needed the log scrolled.
    #
    # coverage_report, so the figure annotates the lines the merge request changed.
    # There is still no threshold - see docs/testing.md, "Coverage is a figure, not a
    # gate" - but a figure nobody is shown is not even that.
    reports:
      junit: dcb-hub-admin-ui/test-results/vitest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: dcb-hub-admin-ui/coverage/cobertura-coverage.xml
    expire_in: 1 week
  # The one line vitest's text-summary prints that GitLab can turn into the job's
  # coverage percentage, which is what draws the trend on the pipeline page.
  coverage: '/^\s*Lines\s*:\s*([\d.]+)%/'

# Separate from verify_quality so a failing accessibility gate is legible as such in the
# pipeline rather than as "the verify job went red". It needs the Playwright image; the
# quality job does not, and pulling that image for a lint run wastes a minute per pipeline.
#
# This includes e2e/accessibility.spec.ts and e2e/setup-accessibility.spec.ts, which are
# the WCAG 2.2 AA gate: zero axe violations in light, dark AND high contrast. High
# contrast has no media query behind it and is only reachable by seeding the stored
# preference - see e2e/fixtures/theme.ts.
#
# It also carries e2e/i18n-missing.spec.ts, the missing-translation gate. That shares
# this job rather than taking one of its own because it needs the same build and the
# same browser: a second job would cost a whole extra `tsc && vite build` for one spec.
# The build arms the collector through playwright.config.ts. See docs/i18n.md.
verify_e2e:
  stage: verify
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble
    pull_policy: if-not-present
  script:
    - echo "runner=$CI_RUNNER_DESCRIPTION cpus=$(nproc) cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) mem_mb=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)"
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    - npx playwright test
  interruptible: true
  # One browser suite at a time on this runner: docs/testing.md, "Parallelism".
  resource_group: browser-suites
  timeout: 40m
  artifacts:
    # `always`, not `on_failure`. playwright.config.ts already writes a junit file and
    # nothing ever collected it, so the 528-test suite reported its result only as a
    # red job. A report that exists on a green run is also how a newly-skipped test
    # gets noticed.
    when: always
    paths:
      - dcb-hub-admin-ui/playwright-report/
      - dcb-hub-admin-ui/test-results/
    reports:
      junit: dcb-hub-admin-ui/test-results/junit.xml
    # A direct link to the HTML report from the merge request, instead of "download
    # the artifact, unzip it, find index.html".
    expose_as: "Playwright report - e2e axe and i18n"
    expire_in: 1 week

# The performance budget - W-2. Its own job because it needs a production build and three
# Lighthouse runs, and because a red budget is a specific conversation ("cut weight or
# bring an argument"), not a generic test failure.
#
# NEVER re-baseline lighthouserc.js to make this pass. See the file.
verify_lighthouse:
  stage: verify
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble
    pull_policy: if-not-present
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    # BYTES FIRST. The chunk budget is deterministic, covers every chunk including the
    # ones no audited page fetches, and fails in seconds - so it runs before three
    # Lighthouse passes rather than after them. VITE_PUBLIC_URL is pinned so the chunk
    # names match the budget regardless of what .env says.
    #
    # It exists because Lighthouse measures PAGES: its total-byte-weight saw 750 KB of
    # the 1,650 KB this application actually ships, and the heaviest chunk in the
    # artefact was outside every gate here. See docs/performance-budget.md.
    - VITE_PUBLIC_URL=/ npm run build
    - npm run budget
    # No separate build step for Lighthouse: lighthouserc.js's startServerCommand builds,
    # because the audit must not measure whatever an earlier job left in dist/.
    - npm run lighthouse
  interruptible: true
  resource_group: browser-suites
  timeout: 30m
  artifacts:
    when: always
    paths:
      - dcb-hub-admin-ui/.lighthouseci/
    expose_as: "Lighthouse run - payload budget"
    expire_in: 1 week

# The base path is baked in by Vite, so the shipped configuration - mounted at
# /dcb-admin so one origin can host dcb-admin-for-libraries beside it - is the one
# configuration verify_e2e does not run: that suite pins the base to "/". A base
# counted twice, by Vite AND by the router, reaches production looking green.
#
# It also carries the co-hosting assertions: storage namespaced by the base rather
# than as "root", and inject_env.json fetched under the base rather than at the
# origin root, where a sibling app's config sits.
verify_base_path:
  stage: verify
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble
    pull_policy: if-not-present
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    - npm run e2e:base-path
  interruptible: true
  resource_group: browser-suites
  timeout: 30m
  artifacts:
    when: always
    paths:
      - dcb-hub-admin-ui/playwright-report/
      - dcb-hub-admin-ui/test-results/
    reports:
      junit: dcb-hub-admin-ui/test-results/junit-base-path.xml
    expose_as: "Playwright report - base path"
    expire_in: 1 week

verify_ki_bootstrap:
  stage: verify
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble
    pull_policy: if-not-present
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    - npm run e2e:ki-bootstrap
  interruptible: true
  resource_group: browser-suites
  timeout: 30m
  # This job had NO artifacts and no report. A failure in the bootloader gate left
  # nothing behind to look at - no trace, no screenshot, no list of which of its four
  # tests went red - which is the gate the workspace notes record reporting "1 of 4"
  # against a build it should not have been measuring.
  artifacts:
    when: always
    paths:
      - dcb-hub-admin-ui/playwright-report/
      - dcb-hub-admin-ui/test-results/
    reports:
      junit: dcb-hub-admin-ui/test-results/junit-ki-bootstrap.xml
    expose_as: "Playwright report - bootloader"
    expire_in: 1 week

# Production dependencies at high severity and above only: the full audit is dominated by
# build tooling that never reaches a browser. docs/testing.md, "The supply-chain gate".
# The artefact that actually ships, driven in a browser - W-6.
#
# Every other verify job measures `vite preview` or a mocked page. docs/testing.md
# records two production defects that lived in that gap (1,576 KB served uncompressed
# against a 665 KB budget; the CSP blocking 40 font loads a session), and this job found
# three more on its first run: the image could not be BUILT at all, because
# .dockerignore excluded a directory two src/ unit tests import fixtures from and
# `npm run build` is `tsc && vite build`; Zod's JIT probe raised a CSP violation on
# every page load; and /login had no h1.
#
# Needs a Docker daemon, which the Playwright image does not have - so this uses docker
# with a mounted socket on the on-prem runner rather than the browser image, and installs
# browsers itself.
verify_container:
  stage: verify
  interruptible: true
  resource_group: browser-suites
  timeout: 40m
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble
    pull_policy: if-not-present
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Matched to the dind service above, so client and daemon are the same major.
    DOCKER_CLI_VERSION: "27.3.1"
  script:
    # THE CLIENT, not the daemon. The Playwright image ships no docker binary at all -
    # the dind service above provides a daemon and nothing to talk to it with, so the
    # job died on "docker: command not found" before reaching the daemon question. The
    # static client only, ~30 MB, rather than apt's docker.io which pulls a second
    # daemon we do not want.
    - |
      if ! command -v docker >/dev/null 2>&1; then
        curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"           | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      fi
    - docker --version
    # Fail HERE, with a sentence, if the daemon is not reachable. Otherwise the first
    # symptom is a playwright webServer timeout 15 minutes later, which reads as the
    # application being broken.
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "No Docker daemon on \$DOCKER_HOST=$DOCKER_HOST."
        echo "This job needs the docker:dind service, which needs a runner that permits"
        echo "privileged containers. See docs/testing.md, 'The container gate'."
        exit 1
      fi
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    - npm run e2e:container
  artifacts:
    when: always
    paths:
      - dcb-hub-admin-ui/playwright-report/
      - dcb-hub-admin-ui/test-results/
    reports:
      junit: dcb-hub-admin-ui/test-results/junit-container.xml
    expose_as: "Playwright report - container"
    expire_in: 1 week

verify_supply_chain:
  stage: verify
  interruptible: true
  timeout: 10m
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    - cd dcb-hub-admin-ui
    - npm ci
    - npm audit --omit=dev --audit-level=high

# Every secret this repository has ever committed stays readable in its history: deleting
# the line does not un-leak it, only rotation does. The baseline holds the 21 findings that
# predate this job, so the pipeline goes red on a NEW secret rather than on the backlog.
verify_secrets:
  stage: verify
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    # GitLab clones 20 commits deep by default, so without this the scan would cover a
    # sliding window and quietly report clean on a repository it never read.
    GIT_DEPTH: "0"
  interruptible: true
  timeout: 15m
  script:
    # --redact so a finding does not print the secret into a job log that is readable by
    # everyone who can see the pipeline.
    - gitleaks git --redact --exit-code 1 --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --report-format sarif --report-path gitleaks.sarif .
  artifacts:
    when: always
    paths:
      - gitleaks.sarif
    expire_in: 1 month

release:
  stage: release
  # This rule ensures the job ONLY runs on the 'release' branch
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: always
    - when: never
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    # Set up git credentials again for this job
    - git config --global user.name "ianibbo"
    - git config --global user.email "ian.ibbotson@k-int.com"
    # semantic-release reads .releaserc.json and package.json, both of which live
    # here, and its @semantic-release/git assets list references ./release-info.json
    # relative to this directory.
    - cd dcb-hub-admin-ui
    - echo " { \"releaseDate\":\"`date +"%Y-%m-%dT%H:%M:%S%z"`\", \"RELEASED_AT\":\"$RELEASED_AT\" } " > ./release-info.json
    - npm ci
    # Run the release, save the version so we can use it in the next stage
    - npm run semantic-release
    # Two independent sources for the same fact: package.json, written by
    # @semantic-release/npm, and the tag, created by semantic-release core. They agree
    # only if the plugin order is right - npm must write the version BEFORE git commits
    # it. When that order was wrong, 2.0.0 shipped labelled 1.58.0 and every gate passed,
    # because everything downstream read the same unbumped file.
    - export RELEASE_VERSION="v$(node -p "require('./package.json').version")"
    - test "$RELEASE_VERSION" = "$(git describe --tags --abbrev=0)"
    # deploy.env is picked up as a dotenv report, whose path IS relative to the
    # repo root - so write it back up there, not into dcb-hub-admin-ui/.
    - echo "RELEASE_VERSION=$RELEASE_VERSION" > ../deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  # This job depends on the build job completing successfully
  dependencies:
    - build

# Builds the bundle AFTER semantic-release has decided the version. vite bakes
# __APP_VERSION__ from package.json at build time, so the `build` stage - which runs
# before `release` - produces an artefact naming the PREVIOUS release. Do not deploy
# that one. See docs/deployment.md, "The version the artefact reports".
build_released_bundle:
  stage: rebuild
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - when: never
  # No `dependencies`: setting it would override `needs` as the list of jobs whose
  # artefacts arrive, and $RELEASE_VERSION arrives as the release job's dotenv report.
  needs:
    - release
  script:
    - export NPM_TOKEN="$NPMJS_TOKEN"
    # A bundle stamped with a version that was never published is worse than a failed job.
    - test -n "$RELEASE_VERSION"
    - cd dcb-hub-admin-ui
    - echo " { \"releaseDate\":\"`date +"%Y-%m-%dT%H:%M:%S%z"`\", \"RELEASED_AT\":\"$RELEASED_AT\" } " > ./release-info.json
    - npm ci
    # semantic-release owns the tag and has already pushed it. --allow-same-version so
    # re-running the job is not a failure.
    - npm version --no-git-tag-version --allow-same-version "${RELEASE_VERSION#v}"
    - VITE_PUBLIC_URL=/dcb-admin/ npm run build
    # The version vite read, then the version that reached the artefact. The second reads
    # the <meta> tag, NOT the minified JS: `grep -rF 9.9.9 dist/assets/` passes against a
    # 2.0.0 bundle, matching an SVG path fragment. See docs/deployment.md.
    - test "v$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
    - grep -qF "<meta name=\"dcb-admin-version\" content=\"${RELEASE_VERSION#v}\">" dist/index.html
  artifacts:
    paths:
      - dcb-hub-admin-ui/dist/
    expire_in: 1 hour

# Copy the dist build up to s3 where we can point cloudflare as a distribution service
deploy_tag_to_s3:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - when: never
  tags:
    - ki-onprem
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  script:
    - echo "Deploying version $RELEASE_VERSION to S3..."
    # Key layout is <env-root>/<app>/, and the worker picks the root by hostname.
    # Trailing slashes are explicit: --delete is scoped to the destination
    # prefix, and one level up it would wipe the sibling apps in this root.
    #
    # THREE PASSES, AND THE ORDER IS LOAD-BEARING.
    #
    # A file may be cached forever only if its NAME changes when its content does.
    # Under assets/ every name carries a content hash, so a change is a new name and
    # the old one can be kept for a year. Six files in dist/ have stable names and
    # cannot: index.html, ki-bootstrap.js, silent-renew.html, locales/**,
    # config-prod.json and the favicon. See docs/deployment.md.
    #
    # A cached file that names hashed chunks --delete has just removed asks for
    # chunks that no longer exist, and every lazy route fails with "Failed to fetch
    # dynamically imported module" - a blank page. That is true of index.html, and
    # equally of ki-bootstrap.js, which is the bootloader's public entry point
    # (vite.config.mts pins its name deliberately) and names those same chunks.
    # src/helpers/chunkReload.ts cannot rescue that one: the reload re-fetches the
    # same immutably-cached bootloader.
    #
    # Hashed assets first, stable names next, shell last, so nothing is ever live
    # before the chunks it names are fetchable. --delete on the first two passes
    # covers the same keys the single pass did, so only the headers change here.
    - aws s3 sync dcb-hub-admin-ui/dist/ "s3://ki-libs-spa-hosting/prod/dcb-admin/" --delete
      --exclude "*" --include "assets/*"
      --cache-control "public, max-age=31536000, immutable"
    # `no-cache` stores the file and revalidates it against the ETag, which is a 304
    # in the common case - not `no-store`, which would refetch these on every load.
    - aws s3 sync dcb-hub-admin-ui/dist/ "s3://ki-libs-spa-hosting/prod/dcb-admin/" --delete
      --exclude "assets/*" --exclude "index.html" --exclude "inject_env.json"
      --cache-control "public, no-cache"
    - aws s3 cp dcb-hub-admin-ui/dist/index.html "s3://ki-libs-spa-hosting/prod/dcb-admin/index.html"
      --cache-control "no-store, no-cache, must-revalidate"
    # Immutable archive of the released bundle, NOT a servable path: the base
    # ("/dcb-admin/") is baked in, so this copy only ever resolves its assets
    # from /dcb-admin/. It exists to roll back from, by copying it over
    # prod/dcb-admin/ - never to be served in place.
    # Uses $RELEASE_VERSION derived from the release job's dotenv artifact
    - aws s3 sync dcb-hub-admin-ui/dist/ "s3://ki-libs-spa-hosting/archive/dcb-admin-$RELEASE_VERSION/" --delete
  variables:
    AWS_ACCESS_KEY_ID: $AWS_DEVOPS_AGENT_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_DEVOPS_AGENT_ACCESS_KEY_SECRET
    AWS_REGION: eu-west-1
  # Both jobs in `needs` and no `dependencies`: the bundle comes from build_released_bundle
  # and $RELEASE_VERSION from release's dotenv, and a `dependencies` list would override
  # which of the two actually arrives.
  needs:
    - release
    - build_released_bundle

# This new option also deploys the bundle to an R2 bucket at cloudflare - but with the intention that this becomes a reusable deployment that is configured by hostname
# My aim here is to add some code that talks to a service and resolves the backend and auth credentials based on hostname so we can deploy a wildcard domain like
# *.dcb.kihosting.net and have all DCB installs served from that one bucket - saving us multiple different deployments. The config could be loaded from a static file
# (Mirroring the current setup) or be a dynamic service for self service deployments. this will give is parkhill-test.dcb.kihosting.net or something similar without needing todo
# zillions of deployments.
# WAS `deploy_tag_to_r2`, on `rules: if: $CI_COMMIT_TAG`, and it had never once run.
# semantic-release tags its own release commit, whose message is
# "chore(release): x.y.z [skip ci]" - and GitLab reads that message on the tag push too,
# so the tag pipeline is skipped every time. `ki-front-end-bundles/dcb-hub-admin-ui/v*/`
# was empty and latest.json had never been written, which is why the KI Console bootloader
# answered 404 for `latest` and for any version. The Cloudflare/S3 path worked because
# deploy_tag_to_s3 runs on the release BRANCH pipeline, which is not skipped.
#
# So this runs where the release actually happens, off $RELEASE_VERSION rather than
# $CI_COMMIT_TAG. It is the same value ("v2.0.0"): the release job derives it from
# package.json after the bump, and fe-bootloader's VERSION_PATTERN requires the v prefix.
deploy_release_to_r2:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - when: never
  tags:
    - ki-onprem
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  script:
    - test -n "$RELEASE_VERSION"
    - echo "Publishing $RELEASE_VERSION to CF R2..."
    # A published version directory is immutable - the worker serves it with
    # max-age=31536000. Refuse to overwrite one rather than change bytes a client may
    # already hold forever.
    - test -z "$(aws s3 ls "s3://ki-front-end-bundles/dcb-hub-admin-ui/${RELEASE_VERSION}/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive)"
    - aws s3 cp dcb-hub-admin-ui/dist/ "s3://ki-front-end-bundles/dcb-hub-admin-ui/${RELEASE_VERSION}/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive
    # The channel file fe-bootloader reads for version "latest". Written AFTER the bundle,
    # so it never names a directory that is not there yet.
    - echo "{\"version\":\"${RELEASE_VERSION}\"}" > latest.json
    - aws s3 cp latest.json "s3://ki-front-end-bundles/dcb-hub-admin-ui/latest.json" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
  variables:
    AWS_ACCESS_KEY_ID: $CF_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $CF_SECRET_ACCESS_KEY
    AWS_REGION: auto
  # $RELEASE_VERSION comes from release's dotenv, the bundle from build_released_bundle -
  # which is the one built AFTER the version bump, so what it names is what it is.
  needs:
    - release
    - build_released_bundle
deploy_dev_to_s3:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
      when: always
    - when: never
  tags:
    - ki-onprem
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  script:
    # dev/, not dcb-admin-dev/. The worker resolves /dcb-admin/... against
    # <env-root>/dcb-admin/, and dev.kihosting.net's root is "dev" - a key
    # prefix it does not know about is a 502, which is precisely what
    # "dcb-admin-dev" was giving us.
    #
    # The same three passes as the prod job, and for the same reason - dev deploys far
    # more often, so a cached file naming deleted chunks bites here first.
    - aws s3 sync dcb-hub-admin-ui/dist/ "s3://ki-libs-spa-hosting/dev/dcb-admin/" --delete
      --exclude "*" --include "assets/*"
      --cache-control "public, max-age=31536000, immutable"
    - aws s3 sync dcb-hub-admin-ui/dist/ "s3://ki-libs-spa-hosting/dev/dcb-admin/" --delete
      --exclude "assets/*" --exclude "index.html" --exclude "inject_env.json"
      --cache-control "public, no-cache"
    - aws s3 cp dcb-hub-admin-ui/dist/index.html "s3://ki-libs-spa-hosting/dev/dcb-admin/index.html"
      --cache-control "no-store, no-cache, must-revalidate"
  variables:
    AWS_ACCESS_KEY_ID: $AWS_DEVOPS_AGENT_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_DEVOPS_AGENT_ACCESS_KEY_SECRET
    AWS_REGION: eu-west-1
  dependencies:
    - build

deploy_dev_to_r2:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
      when: on_success
    - when: never
  tags:
    - ki-onprem
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  script:
    - aws s3 cp dcb-hub-admin-ui/dist/ "s3://ki-front-end-bundles/dcb-hub-admin-ui/next/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive
  variables:
    AWS_ACCESS_KEY_ID: $CF_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $CF_SECRET_ACCESS_KEY
    AWS_REGION: auto
  needs:
    - build
  dependencies:
    - build
