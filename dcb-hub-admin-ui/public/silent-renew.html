<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Renewing session</title>
	</head>
	<body>
		<!--
			The landing page for the hidden OIDC silent-renewal iframe, and nothing
			else. Its only job is to hand the authorization response back up to the
			UserManager in the parent window.

			This exists because silent_redirect_uri defaults to redirect_uri. Without
			it, the renewal iframe loaded the entire admin SPA - fetching
			inject_env.json, every JS chunk, i18n and MUI, mounting the router and
			firing its queries - and had to finish all of that inside
			silentRequestTimeoutInSeconds (10s) or oidc-client-ts declared the renewal
			failed. On a slow connection that is a coin flip, and a lost flip took the
			user's session with it.

			Files in public/ are served verbatim and are never bundled, so this cannot
			import oidc-client-ts to call AbstractChildWindow._notifyParent(). The
			message below is that method's payload exactly - see
			node_modules/oidc-client-ts/dist/esm/oidc-client-ts.js, `messageSource`
			and `_notifyParent`. The parent re-validates origin and OIDC `state`
			before trusting any of it.

			DEPLOYMENT: this URL must be covered by the Keycloak client's Valid
			Redirect URIs. The usual "<app base>/*" wildcard already covers it.
		-->
		<script>
			window.parent.postMessage(
				{ source: "oidc-client", url: window.location.href, keepOpen: false },
				window.location.origin,
			);
		</script>
	</body>
</html>
