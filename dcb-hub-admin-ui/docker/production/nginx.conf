server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The base image ships gzip off, and this image replaces only conf.d/default.conf.
	# Without this the container serves 1,576 KB where Cloudflare serves 665 KB, on the one
	# hosting path the Lighthouse budget never measures. woff2 is already compressed.
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_types
		application/javascript
		text/javascript
		application/json
		text/css
		text/plain
		image/svg+xml
		application/manifest+json;

	include /etc/nginx/security-headers.conf;

	location = /inject_env.json {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-store" always;
	}

	# index.html is the only file naming the build's hashed chunks, and a redeploy replaces
	# every one of those names. A cached copy asks for files that are gone and every lazy
	# route fails with "Failed to fetch dynamically imported module". See docs/deployment.md.
	location = /index.html {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
	}

	# A MISSING ASSET MUST 404. Answering with index.html and a 200 means the browser parses
	# HTML as a module and reports "Unexpected token '<'" - a corrupt bundle rather than an
	# absent file. Names here are content-hashed, so they can be cached indefinitely.
	location /assets/ {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The OIDC renewal iframe's landing page, and the only document allowed an inline script.
	location = /silent-renew.html {
		include /etc/nginx/security-headers-silent-renew.conf;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
	}

	# SPA history-API fallback for client-side routing.
	location / {
		include /etc/nginx/security-headers.conf;
		try_files $uri $uri/ /index.html;
	}
}
