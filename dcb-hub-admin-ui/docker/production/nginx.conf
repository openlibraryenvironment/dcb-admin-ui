server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# COMPRESSION, because the official nginx image does not.
	#
	# `nginx:stable-alpine` ships gzip commented out in its http block, and this image
	# replaces only conf.d/default.conf - so it served everything uncompressed. Measured
	# on this build: 665 KB compressed against 1,576 KB raw. That is 2.4x the payload,
	# on the one hosting path the Lighthouse budget never measures: the budget audits
	# `vite preview`, which compresses, and Cloudflare compresses at the edge, so both
	# of the paths we DO measure hid this one.
	#
	# woff2 is deliberately absent from the type list: it is already compressed, and
	# gzipping it spends CPU to make the file marginally larger.
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_types
		application/javascript
		text/javascript
		application/json
		text/css
		text/plain
		image/svg+xml
		application/manifest+json;

	include /etc/nginx/security-headers.conf;

	# Runtime config rendered by docker-entrypoint.sh from container env vars
	# on every container start - never cache it.
	location = /inject_env.json {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-store" always;
	}

	# index.html is the ONE file that names the build's hashed chunks, and a
	# redeploy replaces every one of those names. A browser serving this document
	# from cache therefore asks for files the new image does not contain, and every
	# lazy route fails with "Failed to fetch dynamically imported module" - a blank
	# page. dcb-admin-for-libraries' image has always carried this block; this one
	# did not, and the two are meant to be interchangeable behind one root.
	location = /index.html {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
	}

	# A MISSING ASSET MUST 404, not fall through to the SPA fallback below.
	#
	# Answering /assets/index-abc123.js with index.html and a 200 is worse than a
	# 404: the browser parses HTML as a JavaScript module and reports
	# "Unexpected token '<'", which looks like a corrupt bundle rather than a file
	# that is simply not there. docs/deployment.md already records this as fatal for
	# the S3 worker path; it was equally true here.
	#
	# Filenames here are content-hashed, so a change is a new name and the old name
	# can be cached indefinitely.
	location /assets/ {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The hidden OIDC renewal iframe's landing page, and the only document in the
	# application allowed to run an inline script. See the file for why it is
	# 'unsafe-inline' scoped to one location rather than a sha256 hash.
	location = /silent-renew.html {
		include /etc/nginx/security-headers-silent-renew.conf;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
	}

	# SPA history-API fallback: unknown paths resolve to index.html so
	# TanStack Router's client-side routing can take over.
	location / {
		include /etc/nginx/security-headers.conf;
		try_files $uri $uri/ /index.html;
	}
}
