# Security headers for the DCB Admin container.
#
# INCLUDED, NOT INHERITED, AND THAT IS THE WHOLE POINT OF THIS FILE.
#
# nginx's `add_header` does not merge across levels: a `location` block containing ANY
# add_header of its own discards every add_header inherited from the enclosing server.
# This config has four locations that each set their own Cache-Control, so headers
# declared once at server level would have applied to nothing a browser actually fetches -
# not index.html, not /assets/, not inject_env.json. The failure is silent, and "we set
# security headers" would have been true of the config and false of the responses.
#
# So this file is included in the server block AND in every location. Adding a location
# means adding the include; there is no inheritance to fall back on.
#
# WHAT IS DELIBERATELY NOT HERE
#
# Strict-Transport-Security. TLS terminates in front of this container, not in it, and
# HSTS is the terminator's to set - emitting it from here would be a claim about a
# connection nginx cannot see, and getting it wrong (on a host that also serves something
# over http) is a self-inflicted outage with a max-age-long tail.

add_header X-Content-Type-Options "nosniff" always;

# URLs in this application carry library, patron-request and cluster UUIDs. Full-URL
# referrers would hand those to every external site an administrator clicks through to.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CONTENT SECURITY POLICY
#
# frame-ancestors 'self', NOT 'none'. 'none' is the reflex answer and it would break
# authentication: oidc-client-ts renews the session in a hidden iframe pointed at this
# origin's own silent-renew.html, and frame-ancestors 'none' blocks same-origin framing
# too. Users would be signed out whenever their token expired, on a policy added to make
# things safer. 'self' still refuses every foreign framer, which is the clickjacking
# protection we actually wanted.
#
# style-src 'unsafe-inline' is unavoidable and is a stated exception rather than an
# oversight: Emotion injects every MUI style as an inline <style> element at runtime.
#
# connect-src and frame-src are 'self' https: rather than an enumeration, because the
# backends and the Keycloak realm are RUNTIME configuration - inject_env.json, rendered
# per container - and are not knowable when this file is written. `https:` still refuses
# plaintext exfiltration; tightening it to the exact origins means templating this policy
# through envsubst the way inject_env.json already is, which is the follow-up.
#
# img-src allows https: because a consortium's brand logo may be an absolute URL on
# somebody else's host; dcb-service accepts one on write.
#
# font-src allows data: because VITE INLINES SOME OF OUR OWN FONTS. Roboto's Greek-Extended
# subsets (U+1F??) are each under the 4KB assetsInlineLimit, so four weights x woff+woff2
# become eight data: URIs in the theme stylesheet. Without this the browser blocked all
# eight on every page load in the container - eight console errors a user never asked for,
# and any Greek-Extended text silently falling back down the stack. Found by loading the
# built image in a browser; curling the headers cannot see it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
