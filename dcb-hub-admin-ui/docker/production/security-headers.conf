# Security headers. Rationale and the decisions behind the policy: docs/deployment.md.
#
# INCLUDED IN EVERY LOCATION, NOT INHERITED. nginx's `add_header` does not merge across
# levels: a location containing any add_header of its own discards every inherited one,
# silently, with `nginx -t` still reporting the config valid. Adding a location means
# adding the include. src/helpers/nginxConfig.test.ts fails if one is missed.
#
# No Strict-Transport-Security: TLS terminates in front of this container, not in it.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# frame-ancestors 'self', NOT 'none': the OIDC silent-renewal iframe is same-origin, and
# 'none' would sign every user out at token expiry.
#
# style-src 'unsafe-inline' is unavoidable — Emotion injects every MUI style at runtime.
# connect-src/frame-src are `https:` rather than an enumeration because the backends are
# runtime config. font-src allows data: because Vite inlines our own font subsets.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
