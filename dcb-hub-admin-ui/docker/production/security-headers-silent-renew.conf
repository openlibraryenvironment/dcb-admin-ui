# The same headers as security-headers.conf with ONE relaxation, for ONE file:
# public/silent-renew.html carries an inline <script> it cannot avoid, because files in
# public/ are served verbatim and it cannot import oidc-client-ts to call _notifyParent().
#
# 'unsafe-inline' rather than a sha256 hash, deliberately: the hash is over exact bytes,
# git stores this file LF and hands a Windows checkout CRLF, so a hash computed locally
# would not match what CI builds — a policy that passes review and silently kills session
# renewal in production. The exception is bounded to one twenty-line static file with no
# input, no interpolation and no imports. See docs/deployment.md.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# frame-ancestors 'self' matters most on THIS file: it is the document that is legitimately
# framed, by our own application.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
