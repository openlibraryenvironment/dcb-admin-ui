# The same headers as security-headers.conf, with ONE relaxation, for ONE file.
#
# public/silent-renew.html carries an inline <script>. It has to: files in public/ are
# served verbatim and never bundled, so it cannot import oidc-client-ts to call
# `_notifyParent()` - it reproduces that method's postMessage by hand. Under the strict
# `script-src 'self'` next door the browser would refuse to run it, the renewal iframe
# would never answer, and every user would be signed out when their token expired.
#
# WHY 'unsafe-inline' HERE AND NOT A HASH.
#
# A sha256 hash is the textbook answer and it is the wrong one in this repository. The
# hash is over the script's exact bytes, and this file's line endings are not stable
# across checkouts: git stores it LF and hands it to a Windows working copy as CRLF, so a
# hash computed on a developer's machine does not match the bytes a Linux CI job builds
# into the image. The failure mode is a policy that passes review, passes locally, and
# silently kills session renewal in production - and it would recur every time anybody
# touched the file.
#
# The exception is bounded to a degree that makes this a fair trade: this location matches
# exactly one static file, twenty lines long, with no user input, no interpolation, no
# imports and no DOM beyond a postMessage to `window.location.origin`. There is nothing
# for an injected script to be injected INTO. Every other document in the application
# keeps `script-src 'self'`.
#
# The durable fix is to move that script to its own .js file in public/, after which
# 'self' covers it and this file can be deleted. That is a change to the authentication
# path and wants a run against a real Keycloak, which is why it is not being made in the
# same commit as a header change.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# frame-ancestors 'self' is load-bearing on THIS file above all others: it is the document
# that is legitimately framed, by our own application.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
